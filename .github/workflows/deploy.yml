name: Sync main for Vercel production

on:
  push:
    branches:
      - claude/model-un-school-website-hzro7s
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-main
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Push to main
        run: git push --force origin HEAD:main
